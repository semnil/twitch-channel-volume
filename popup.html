<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Twitch Channel Volume</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 320px;
  font-family: 'Segoe UI', 'Yu Gothic UI', sans-serif;
  font-size: 13px;
  color: #e1e1e1;
  background: #1a1a2e;
}
body.initializing { visibility: hidden; }
body.initializing .toggle-switch .switch-slider,
body.initializing .toggle-switch .switch-slider::before { transition: none; }

.header {
  padding: 12px 16px 8px;
  border-bottom: 1px solid #2a2a4a;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.header h1 {
  font-size: 14px;
  font-weight: 600;
  color: #4ecdc4;
  letter-spacing: 0.5px;
}
.settings-link {
  font-size: 16px;
  color: #666;
  background: none;
  border: none;
  cursor: pointer;
  padding: 0 2px;
  line-height: 1;
  transition: color 0.15s;
}
.settings-link:hover { color: #4ecdc4; }

.type-badge {
  font-size: 9px;
  font-weight: 700;
  padding: 2px 6px;
  border-radius: 3px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  white-space: nowrap;
  flex-shrink: 0;
}
.type-badge.live { background: #e91916; color: #fff; }
.type-badge.vod { background: #2a2a4a; color: #aaa; }
.type-badge.clip { background: #9147ff; color: #fff; }

.ad-badge {
  font-size: 9px;
  font-weight: 700;
  padding: 2px 6px;
  border-radius: 3px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  background: #f9ca24;
  color: #1a1a2e;
  white-space: nowrap;
  flex-shrink: 0;
}

.info-section {
  padding: 12px 16px;
  background: #16213e;
  border-bottom: 1px solid #2a2a4a;
}
.channel-row {
  min-height: 36px;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.channel-identity {
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 6px;
}
.channel-name {
  min-width: 0;
  font-size: 13px;
  font-weight: 600;
  color: #fff;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.channel-name.empty {
  color: #666;
  font-weight: 400;
}
.reset-measurement-btn {
  flex: 0 0 auto;
  width: 36px;
  height: 36px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 1px solid rgba(78, 205, 196, 0.48);
  border-radius: 6px;
  color: #4ecdc4;
  background: rgba(78, 205, 196, 0.06);
  font: inherit;
  font-size: 10px;
  font-weight: 700;
  white-space: nowrap;
  cursor: pointer;
}
.reset-measurement-btn .sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  border: 0;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}
.reset-measurement-btn svg {
  width: 17px;
  height: 17px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.reset-measurement-btn:hover:not(:disabled) {
  background: rgba(78, 205, 196, 0.14);
}
.reset-measurement-btn:focus-visible {
  outline: 2px solid #4ecdc4;
  outline-offset: 2px;
}
.reset-measurement-btn:disabled {
  border-color: #2a2a4a;
  color: #666;
  background: transparent;
  cursor: default;
}
.reset-measurement-error {
  margin: -4px 0 8px;
  color: #ff6b9d;
  font-size: 9px;
  line-height: 1.25;
  text-align: right;
}

.loudness-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 5px;
}
.loudness-card {
  background: #1a1a2e;
  border-radius: 6px;
  padding: 7px 8px;
}
.loudness-card .label {
  font-size: 9px;
  color: #888;
  text-transform: uppercase;
  letter-spacing: 0.3px;
}
.fallback-badge {
  display: block;
  width: fit-content;
  margin-top: 2px;
  padding: 1px 4px;
  border-radius: 3px;
  color: #f9ca24;
  background: #332f1d;
  font-size: 8px;
  line-height: 1.2;
  text-transform: none;
  letter-spacing: 0;
}
.loudness-card .value {
  font-size: 17px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  color: #4ecdc4;
  margin-top: 2px;
}
.loudness-card .value.suggested { color: #f9ca24; }
.loudness-card .value.current { color: #ff6b9d; }
.loudness-card .value.unknown { color: #555; font-size: 13px; }
.loudness-card .unit {
  font-size: 10px;
  font-weight: 400;
  color: #888;
  margin-left: 1px;
}

.auto-section {
  padding: 8px 16px;
  border-bottom: 1px solid #2a2a4a;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.auto-label {
  font-size: 12px;
  font-weight: 600;
  color: #ccc;
}
.auto-copy { min-width: 0; }
.auto-error {
  margin-top: 2px;
  color: #ff6b9d;
  font-size: 9px;
  line-height: 1.25;
}
.toggle-switch {
  position: relative;
  width: 36px;
  height: 36px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  cursor: pointer;
}
.toggle-switch input {
  position: absolute;
  inset: 0;
  opacity: 0;
  width: 100%;
  height: 100%;
  margin: 0;
  cursor: pointer;
}
.toggle-switch .switch-slider {
  position: relative;
  width: 36px;
  height: 20px;
  background: #2a2a4a;
  border-radius: 10px;
  transition: background 0.2s;
  pointer-events: none;
}
.toggle-switch .switch-slider::before {
  content: '';
  position: absolute;
  width: 14px;
  height: 14px;
  left: 3px;
  top: 3px;
  background: #888;
  border-radius: 50%;
  transition: transform 0.2s, background 0.2s;
}
.toggle-switch input:checked + .switch-slider { background: #1b3a4b; }
.toggle-switch input:checked + .switch-slider::before {
  transform: translateX(16px);
  background: #4ecdc4;
}
.toggle-switch input:focus-visible + .switch-slider {
  outline: 2px solid #4ecdc4;
  outline-offset: 2px;
}
.toggle-switch input:disabled { cursor: default; }
.toggle-switch input:disabled + .switch-slider {
  opacity: 0.45;
}
@media (prefers-reduced-motion: reduce) {
  .toggle-switch .switch-slider,
  .toggle-switch .switch-slider::before {
    transition: none;
  }
}

.apply-section {
  padding: 10px 16px;
  border-bottom: 1px solid #2a2a4a;
  display: flex;
  align-items: center;
  gap: 8px;
}
.apply-btn {
  flex: 1;
  padding: 8px 0;
  font-size: 12px;
  font-weight: 700;
  color: #1a1a2e;
  background: #4ecdc4;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  transition: opacity 0.15s;
}
.apply-btn:hover { opacity: 0.85; }
.apply-btn:disabled {
  background: #2a2a4a;
  color: #555;
  cursor: default;
  opacity: 1;
}
.apply-hint {
  font-size: 10px;
  color: #666;
  line-height: 1.3;
  max-width: 140px;
}
.apply-hint.error { color: #ff6b9d; }

.manual-section {
  padding: 10px 16px;
}
.manual-section.disabled { opacity: 0.45; }
.manual-section.disabled input,
.manual-section.disabled button { cursor: default; }
.manual-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 6px;
}
.manual-header .label {
  font-size: 11px;
  color: #888;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.slider-row {
  display: flex;
  align-items: center;
  gap: 8px;
}
.slider-row input[type="range"] {
  flex: 1;
  height: 6px;
  -webkit-appearance: none;
  appearance: none;
  background: #2a2a4a;
  border-radius: 3px;
  outline: none;
}
.slider-row input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: #ff6b9d;
  cursor: pointer;
  border: 2px solid #1a1a2e;
}
.slider-value {
  min-width: 42px;
  text-align: right;
  font-size: 14px;
  font-weight: 700;
  color: #ff6b9d;
  font-variant-numeric: tabular-nums;
}

.presets {
  display: flex;
  gap: 4px;
  margin-top: 6px;
}
.presets button {
  flex: 1;
  padding: 4px 0;
  font-size: 11px;
  font-weight: 600;
  color: #aaa;
  background: #2a2a4a;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
}
.presets button:hover:not(:disabled) {
  background: #ff6b9d;
  color: #fff;
}

.status-msg {
  padding: 20px 16px;
  text-align: center;
  color: #555;
}
.hidden { display: none; }
</style>
</head>
<body class="initializing">
<div class="header">
  <h1>Twitch Channel Volume</h1>
  <button id="optionsBtn" class="settings-link" title="Settings">&#9881;</button>
</div>

<div id="errBox" class="status-msg hidden"></div>

<div id="mainArea">
  <div class="info-section">
    <div class="channel-row">
      <div class="channel-identity">
        <div id="channelName" class="channel-name empty" data-i18n="channelNotDetected">チャンネル未検出</div>
        <span id="channelKind" class="type-badge hidden"></span>
        <span id="adFlag" class="ad-badge hidden" data-i18n="adDetected">CM 検出中</span>
      </div>
      <button id="resetMeasurementBtn" class="reset-measurement-btn" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 4v6h6"></path>
          <path d="M5.6 16.5a8 8 0 1 0 .5-9.6L4 10"></path>
        </svg>
        <span class="sr-only" data-i18n="resetMeasurement">測定値をリセット</span>
      </button>
    </div>
    <div id="resetMeasurementError" class="reset-measurement-error hidden" role="status" data-i18n="resetMeasurementFailed">測定値をリセットできませんでした。もう一度お試しください</div>
    <div class="loudness-grid">
      <div class="loudness-card">
        <div class="label" data-i18n="labelIntegrated">Integrated</div>
        <div id="integrated" class="value unknown">---</div>
      </div>
      <div class="loudness-card">
        <div class="label" data-i18n="labelSuggested">Suggested</div>
        <div id="suggested" class="value suggested unknown">---</div>
      </div>
      <div class="loudness-card">
        <div class="label">
          <span data-i18n="labelCurrent">Current</span>
          <span id="fallbackBadge" class="fallback-badge hidden" data-i18n="labelFallback">Fallback</span>
        </div>
        <div id="current" class="value current">100%</div>
      </div>
    </div>
  </div>

  <div class="auto-section">
    <div class="auto-copy">
      <div id="autoApplyLabel" class="auto-label" data-i18n="autoApplyLoudness">LUFS 自動追従</div>
      <div id="autoError" class="auto-error hidden" role="status" data-i18n="autoSaveFailed">自動追従の設定を保存できませんでした</div>
    </div>
    <label class="toggle-switch">
      <input type="checkbox" id="autoApplyToggle" aria-labelledby="autoApplyLabel" disabled>
      <span class="switch-slider"></span>
    </label>
  </div>

  <div class="apply-section">
    <button id="applyBtn" class="apply-btn" disabled data-i18n="applyToChannel">チャンネルに適用</button>
    <span id="applyHint" class="apply-hint" data-i18n="hintNoLufs">ラウドネス計測中...</span>
  </div>

  <div id="manualSection" class="manual-section">
    <div class="manual-header">
      <span class="label" data-i18n="manualVolume">Manual Volume</span>
    </div>
    <div class="slider-row">
      <input type="range" id="manualSlider" min="0" max="600" value="100" step="5">
      <span id="manualValue" class="slider-value">100%</span>
    </div>
    <div class="presets">
      <button data-gain="0">0%</button>
      <button data-gain="50">50%</button>
      <button data-gain="100">100%</button>
      <button data-gain="200">200%</button>
      <button data-gain="400">400%</button>
      <button data-gain="600">MAX</button>
    </div>
  </div>
</div>

<script src="utils.js"></script>
<script src="popup.js"></script>
</body>
</html>
