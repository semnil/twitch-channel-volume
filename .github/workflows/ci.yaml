name: CI
run-name: ${{ github.ref_name }} CI ✅

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test 🧪
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set Up Node 🟢
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Set Up Python 🐍
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      # Before the tests: the ones that hand the generator trees it has to turn
      # down skip themselves where it cannot draw, and a skip proves nothing.
      - name: Install Pillow 🖼️
        run: pip install pillow==12.2.0
        timeout-minutes: 5

      - name: Check Python Syntax 🐍
        run: python3 -B -c "import ast,pathlib; [ast.parse(p.read_text()) for p in pathlib.Path('.').glob('*.py')]"

      - name: Run Unit Tests ✅
        run: node test.js

      - name: Check Screenshots 📸
        id: screenshots
        timeout-minutes: 5
        run: python3 gen_screenshots.py --check

      - name: Draw Them Again For Inspection 🖼️
        id: redraw
        if: failure() && steps.screenshots.conclusion == 'failure'
        timeout-minutes: 5
        run: python3 gen_screenshots.py --out ${{ runner.temp }}/screenshots-from-ci

      - name: Upload What The Runner Drew 📡
        if: failure() && steps.redraw.conclusion == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: screenshots-from-ci
          path: ${{ runner.temp }}/screenshots-from-ci/
          if-no-files-found: error
