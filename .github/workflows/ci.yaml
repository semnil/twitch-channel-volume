name: CI
run-name: ${{ github.ref_name }} CI ✅

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test 🧪
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set Up Node 🟢
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'

      - name: Set Up Python 🐍
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      # Before the tests: the ones that need Pillow skip themselves where it is
      # missing, and a skip holds nothing.
      - name: Install Pillow 🖼️
        run: pip install pillow==12.2.0
        timeout-minutes: 5

      - name: Check Python Syntax 🐍
        run: python3 -B -c "import ast,pathlib; [ast.parse(p.read_text()) for p in pathlib.Path('.').glob('*.py')]"

      - name: Check The Shared Files 🔗
        timeout-minutes: 5
        run: bash tools/check-shared.sh

      - name: Run Unit Tests ✅
        run: node test.js
        env:
          NODE_V8_COVERAGE: ${{ runner.temp }}/v8-coverage

      # The steps below run in the extensions that carry the file they run.
      - name: Run Navigation Tests ✅
        if: hashFiles('test-navigation.js') != ''
        run: node test-navigation.js
        env:
          NODE_V8_COVERAGE: ${{ runner.temp }}/v8-coverage

      - name: Run Screenshot Path Tests ✅
        if: hashFiles('test-screenshots.py') != ''
        run: python3 test-screenshots.py

      - name: Check Screenshots 📸
        id: screenshots
        if: hashFiles('gen_screenshots.py') != ''
        timeout-minutes: 5
        run: python3 gen_screenshots.py --check

      - name: Draw Them Again For Inspection 🖼️
        id: redraw
        if: failure() && steps.screenshots.conclusion == 'failure'
        timeout-minutes: 5
        run: python3 gen_screenshots.py --out ${{ runner.temp }}/screenshots-from-ci

      - name: Upload What The Runner Drew 📡
        if: failure() && steps.redraw.conclusion == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots-from-ci
          path: ${{ runner.temp }}/screenshots-from-ci/
          if-no-files-found: error

      # The shared code under core/ is covered by channel-volume-core's own
      # suite, so the report is of this extension's own scripts.
      - name: Make The Coverage Report 📊
        run: node tools/coverage/v8-to-lcov.mjs "$RUNNER_TEMP/v8-coverage" "$RUNNER_TEMP/coverage.lcov" $(python3 -B pack.py --list | grep '\.js$' | grep -v '^core/')

      # A public repository uploads without a token; a private one holds it as
      # the CODECOV_TOKEN secret. An unset secret reads as an empty token.
      - name: Upload Coverage ☂️
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        timeout-minutes: 5
        with:
          files: ${{ runner.temp }}/coverage.lcov
          disable_search: true
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

