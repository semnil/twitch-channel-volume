name: CI
run-name: ${{ github.ref_name }} CI ✅

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test 🧪
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set Up Node 🟢
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check Python Syntax 🐍
        run: python3 -B -c "import ast,pathlib; [ast.parse(p.read_text()) for p in pathlib.Path('.').glob('*.py')]"

      - name: Run Unit Tests ✅
        run: node test.js

      - name: Set Up Python 🐍
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Pillow 🖼️
        run: pip install pillow==12.2.0
        timeout-minutes: 5

      - name: Check Screenshots 📸
        id: screenshots
        timeout-minutes: 5
        run: python3 gen_screenshots.py --check

      - name: Draw Them Again For Inspection 🖼️
        id: redraw
        if: failure() && steps.screenshots.conclusion == 'failure'
        timeout-minutes: 5
        run: python3 gen_screenshots.py --out ${{ runner.temp }}/screenshots-from-ci

      - name: Upload What The Runner Drew 📡
        if: failure() && steps.redraw.conclusion == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: screenshots-from-ci
          path: ${{ runner.temp }}/screenshots-from-ci/
          if-no-files-found: error
