name: Release
run-name: ${{ github.ref_name }} release build 🚀

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-event:
    name: Check Release Tag ☑️
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
      validTag: ${{ steps.check.outputs.validTag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check Tag ☑️
        id: check
        run: bash tools/check-tag.sh

  build:
    name: Build Extension Zip 🧱
    needs: check-event
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set Up Node 🟢
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Set Up Python 🐍
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # Before the tests: the ones that hand the generator trees it has to turn
      # down skip themselves where it cannot draw, and a skip proves nothing.
      - name: Install Pillow 🖼️
        run: pip install pillow==12.2.0
        timeout-minutes: 5

      - name: Check Python Syntax 🐍
        run: python3 -B -c "import ast,pathlib; [ast.parse(p.read_text()) for p in pathlib.Path('.').glob('*.py')]"

      - name: Run Unit Tests ✅
        run: node test.js

      - name: Check Screenshots 📸
        timeout-minutes: 5
        run: python3 gen_screenshots.py --check

      # The tag and the manifest have to agree where a release is made from
      # them, and nowhere else: a run from a branch has a branch name where the
      # tag would be, and create-release below reads the same flag.
      - name: Verify manifest version matches tag 🔍
        if: needs.check-event.outputs.validTag == 'true'
        run: bash tools/verify-version.sh

      - name: Pack Extension 📦
        run: python pack.py

      - name: Upload Artifacts 📡
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: twitch-channel-volume-zip
          path: twitch-channel-volume-*.zip
          if-no-files-found: error

  create-release:
    name: Create Release 🛫
    needs: [check-event, build]
    if: needs.check-event.outputs.validTag == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Download Build Artifacts 📥
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release 🛫
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          prerelease: ${{ needs.check-event.outputs.prerelease == 'true' }}
          tag_name: ${{ needs.check-event.outputs.version }}
          name: ${{ needs.check-event.outputs.version }}
          generate_release_notes: true
          files: |
            artifacts/*.zip
